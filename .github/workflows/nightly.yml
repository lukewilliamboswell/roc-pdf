name: Nightly compatibility

# Tests the latest published release's examples archive against the latest
# Roc nightly. The shared workflow selects one immutable release/compiler pair
# and owns validation, compiler diagnostics, execution and issue reporting.
on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:
    inputs:
      nightly-tag:
        description: "Exact nightly tag for a diagnostic rerun; empty resolves latest"
        type: string
        default: ""
      release-tag:
        description: "Exact final release tag for a diagnostic rerun; empty resolves latest"
        type: string
        default: ""

permissions: {}

jobs:
  compatibility:
    permissions:
      contents: read
      issues: write
    uses: lukewilliamboswell/roc-automation/.github/workflows/nightly-compatibility.yml@a25b5129340b9b2ad1744d20330b8ee4d38a1849
    with:
      nightly-tag: ${{ inputs.nightly-tag || '' }}
      release-tag: ${{ inputs.release-tag || '' }}
      runners: '["ubuntu-24.04"]'
      case-timeout-ms: '120000'
