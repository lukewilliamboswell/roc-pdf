name: Applicable checks

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      release_version:
        default: ''
        type: string
      full_validation:
        default: false
        type: boolean
      nightly_validation:
        default: false
        type: boolean
      release_payload:
        description: Build the complete publication payload during a named release rehearsal
        default: false
        type: boolean
    outputs:
      release-version:
        value: ${{ jobs.bundle.outputs.version }}
      artifact-name:
        value: roc-pdf-release-${{ inputs.source_sha }}

permissions:
  contents: read

# Called workflows use a distinct group from their controller.
concurrency:
  group: checks-${{ github.workflow }}-${{ inputs.source_sha }}
  cancel-in-progress: true

jobs:
  version:
    name: Record checked source and authored version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - id: version
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          REQUESTED_VERSION: ${{ inputs.release_version }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 scripts/check_release_version.py --self-test
          python3 scripts/test_check_ci_release.py
          if [[ -z "$REQUESTED_VERSION" && -f docs/releases/unreleased.adoc ]]; then
            version=unreleased
          else
            version="${REQUESTED_VERSION:-$(python3 scripts/release_artifacts.py --latest-notes)}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]
            test -f "docs/releases/$version.adoc"
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
  test:
    needs: version
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Ordinary pull requests use Linux; main and release runs also prove the
    # registered macOS target. Both enforce their pinned allocation evidence.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.full_validation && fromJSON('["ubuntu-22.04", "macos-15"]') || fromJSON('["ubuntu-22.04"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.14.0

      # Blueprint verifies its own binary against the reviewed digest, then
      # fetches Zig 0.16.0 by the digest in Blueprint.lock for the dev tasks.
      - name: Install Blueprint
        uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@2b0ffc9c556f465759ca81055bb819c7e15624eb
        with:
          cache: "true"
          cache-workload: dev

      - name: Check Blueprint configuration
        run: blueprint check

      - name: Verify production resource generators without rewriting assets
        run: |
          python3 scripts/build_roc_font_instances.py --check
          python3 scripts/build_srgb_profile.py --check

      - name: Read pinned Roc nightly
        run: printf 'ROC_NIGHTLY_TAG=%s\n' "$(sed -n '1p' .roc-version)" >> "$GITHUB_ENV"

      - name: Install Roc
        id: roc
        uses: lukewilliamboswell/roc-automation/actions/setup-roc-nightly@dd30a5dd576973b6e224db70d96e3e12c96bcc95
        with:
          nightly-tag: ${{ env.ROC_NIGHTLY_TAG }}

      - name: Bind clean measured source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          INSTALLED_ROC: ${{ steps.roc.outputs.roc }}
        run: |
          python3 scripts/test_prepare_ci_source.py
          python3 scripts/prepare_ci_source.py

      - name: Run spec-defined e2e evidence
        run: blueprint run test -- --compare-baselines --baseline-report .roc-pdf-tmp/ci-baselines.json --improvement-report .roc-pdf-tmp/ci-allocation-improvements.json

      - name: Preserve exact allocation and functional diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dev-evidence-${{ inputs.source_sha }}-${{ matrix.os }}
          path: |
            .roc-pdf-tmp/ci-source.json
            .roc-pdf-tmp/ci-baselines.json
            .roc-pdf-tmp/ci-allocation-improvements.json
            .roc-pdf-tmp/logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Verify release bundle consumer boundary
        run: blueprint run bundle-consumer

      - name: Verify public example gallery
        if: runner.os == 'Linux'
        run: blueprint run gallery

  # Each property target builds and replays its seed corpus plus a few
  # fixed-seed inputs within one second of workload. The test job only
  # formats, checks, and runs the `expect`s in these sources. This job is
  # compile-bound (LLVM fuzz builds), so it runs beside the test job and
  # builds two shared suites in parallel as memory allows, then supervises
  # each property with its own corpus, limits and baseline. The bounded search is
  # fuzz.yml, which never runs on a pull request.
  fuzz-smoke:
    needs: version
    name: Fuzz smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.full_validation && fromJSON('["ubuntu-22.04", "macos-15"]') || fromJSON('["ubuntu-22.04"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Install Blueprint
        uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@2b0ffc9c556f465759ca81055bb819c7e15624eb
        with:
          cache: "true"
          cache-workload: dev

      - name: Read pinned Roc nightly
        run: printf 'ROC_NIGHTLY_TAG=%s\n' "$(sed -n '1p' .roc-version)" >> "$GITHUB_ENV"

      - name: Install Roc
        id: roc
        uses: lukewilliamboswell/roc-automation/actions/setup-roc-nightly@dd30a5dd576973b6e224db70d96e3e12c96bcc95
        with:
          nightly-tag: ${{ env.ROC_NIGHTLY_TAG }}

      - name: Bind clean measured source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          INSTALLED_ROC: ${{ steps.roc.outputs.roc }}
        run: |
          python3 scripts/test_prepare_ci_source.py
          python3 scripts/prepare_ci_source.py

      - name: Run property fuzz smoke
        run: blueprint run fuzz

      - name: Preserve property and allocation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fuzz-evidence-${{ inputs.source_sha }}-${{ matrix.os }}
          path: |
            .roc-pdf-tmp/ci-source.json
            .roc-pdf-tmp/fuzz-artifacts/
          if-no-files-found: error
          retention-days: 14

  docs:
    name: Manual and public API
    needs: version
    uses: ./.github/workflows/docs-build.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      docs_version: ${{ needs.version.outputs.version }}

  bundle:
    name: Bundle and smoke-test gallery
    needs: [docs, version]
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Verify recorded revision
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: 3.14.0
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@2b0ffc9c556f465759ca81055bb819c7e15624eb
      - name: Read pinned compiler
        run: printf 'ROC_NIGHTLY_TAG=%s\n' "$(cat .roc-version)" >> "$GITHUB_ENV"
      - uses: lukewilliamboswell/roc-automation/actions/setup-roc-nightly@dd30a5dd576973b6e224db70d96e3e12c96bcc95
        with:
          nightly-tag: ${{ env.ROC_NIGHTLY_TAG }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: roc-pdf-docs-${{ inputs.source_sha }}
          path: generated-docs
      - id: version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build fresh candidate package
        id: candidate
        run: |
          test ! -e dist && test ! -L dist
          blueprint run bundle
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          bundles = list(Path('dist').glob('*.tar.zst'))
          assert len(bundles) == 1 and bundles[0].is_file() and not bundles[0].is_symlink(), 'require one fresh regular package'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'bundle={bundles[0]}\n')
          PYTHON
      - name: Check release version or exact published package identity
        if: ${{ !inputs.nightly_validation && steps.version.outputs.version != 'unreleased' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          EXPLICIT_RELEASE: ${{ inputs.release_version }}
          CANDIDATE_BUNDLE: ${{ steps.candidate.outputs.bundle }}
        run: |
          python3 scripts/check_ci_release.py --requested "$RELEASE_VERSION" --explicit-release "$EXPLICIT_RELEASE" --bundle "$CANDIDATE_BUNDLE"
      - id: release-renderer
        if: ${{ steps.version.outputs.version != 'unreleased' && (!inputs.nightly_validation || inputs.release_payload) }}
        uses: lukewilliamboswell/roc-automation/actions/blueprint-tool@dd30a5dd576973b6e224db70d96e3e12c96bcc95
        with:
          task: docs-path
          label: Locked release notes renderer
      - name: Test fresh bundle and applicable release artifacts
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          CANDIDATE_BUNDLE: ${{ steps.candidate.outputs.bundle }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          NIGHTLY_VALIDATION: ${{ inputs.nightly_validation }}
          RELEASE_PAYLOAD: ${{ inputs.release_payload }}
          ROC_DOCS_BINARY: ${{ steps.release-renderer.outputs.binary }}
        run: |
          ROC=roc python3 scripts/check_gallery.py --bundle-path "$CANDIDATE_BUNDLE"
          python3 scripts/release_artifacts.py --self-test
          if [[ "$RELEASE_VERSION" == unreleased ]]; then exit 0; fi
          ROC=roc python3 scripts/examples_archive.py --bundle-path "$CANDIDATE_BUNDLE" --tag "$RELEASE_VERSION" --output-dir dist --test-bundle
          # An explicit release rehearsal builds the same publication files.
          # Untagged compiler candidates can retain notes for the published pin.
          if [[ "$NIGHTLY_VALIDATION" != true || "$RELEASE_PAYLOAD" == true ]]; then
            ROC=roc python3 scripts/release_artifacts.py --tag "$RELEASE_VERSION" --bundle "$CANDIDATE_BUNDLE" --revision "$SOURCE_SHA"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: roc-pdf-release-${{ inputs.source_sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: CI
    if: always()
    needs: [version, test, fuzz-smoke, docs, bundle]
    runs-on: ubuntu-22.04
    steps:
      - name: Require every applicable check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          assert not failed, f'Incomplete applicable checks: {failed}'
          PYTHON
