name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
          use-cache: false

      - name: Read pinned Roc nightly
        run: printf 'ROC_NIGHTLY_TAG=%s\n' "$(sed -n '1p' .roc-version)" >> "$GITHUB_ENV"

      - name: Install Roc
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ env.ROC_NIGHTLY_TAG }}

      - name: Test
        run: ./scripts/test.py

      - name: Install pinned qpdf
        if: runner.os == 'Linux'
        run: |
          curl -L --fail --output /tmp/qpdf-12.3.2-linux.zip https://github.com/qpdf/qpdf/releases/download/v12.3.2/qpdf-12.3.2-bin-linux-x86_64.zip
          echo '44f2c53bf784c0143128d80d2b9946e9793962c5bb403b75c0024cb4d8e346b9  /tmp/qpdf-12.3.2-linux.zip' | sha256sum --check
          unzip -q /tmp/qpdf-12.3.2-linux.zip -d /tmp/qpdf-12.3.2

      - name: Validate structural PDF with qpdf 12.3.2
        if: runner.os == 'Linux'
        run: |
          /tmp/qpdf-12.3.2/bin/qpdf --check tests/gate1_blank/snapshot.pdf
          /tmp/qpdf-12.3.2/bin/qpdf --check tests/gate1_deflate_one_block/snapshot.pdf
          /tmp/qpdf-12.3.2/bin/qpdf --check tests/gate1_deflate/snapshot.pdf
          /tmp/qpdf-12.3.2/bin/qpdf --check tests/gate1_pages/snapshot.pdf
          /tmp/qpdf-12.3.2/bin/qpdf --check tests/gate1_retention/snapshot.pdf

      - name: Install Java 17 for PDFBox
        if: runner.os == 'Linux'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Apache PDFBox
        if: runner.os == 'Linux'
        run: |
          curl -L --fail --output /tmp/pdfbox-app-3.0.8.jar https://archive.apache.org/dist/pdfbox/3.0.8/pdfbox-app-3.0.8.jar
          echo '768847238f683568507bf73570a2b6fedcbe58b25c7b4f97fba536ba110b290fe96ba065aed58629d41fb94857d76bc1978c2f31d294b553c69f287f71ee9600  /tmp/pdfbox-app-3.0.8.jar' | sha512sum --check

      - name: Parse strictly with Apache PDFBox 3.0.8
        if: runner.os == 'Linux'
        run: python3 scripts/check_pdfbox.py --jar /tmp/pdfbox-app-3.0.8.jar

      - name: Validate object model with veraPDF Arlington 1.30.2
        if: runner.os == 'Linux'
        run: |
          docker run --rm -d --name gate1-arlington -p 127.0.0.1:18080:8080 verapdf/arlington@sha256:1543368902c393771557e2a1da69e64ad72b69db32e6efebd38a09a7b86eacbc
          trap 'docker stop gate1-arlington' EXIT
          python3 scripts/check_arlington.py \
            tests/gate1_blank/snapshot.pdf \
            tests/gate1_deflate_one_block/snapshot.pdf \
            tests/gate1_deflate/snapshot.pdf \
            tests/gate1_pages/snapshot.pdf \
            tests/gate1_retention/snapshot.pdf
