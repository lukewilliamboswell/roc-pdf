name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: roc-pdf
    # The pull-request gate runs the Linux target, which is the one with
    # measured allocation baselines. macOS still runs on pushes to main and
    # on demand, so platform-specific breakage is caught without paying for
    # a second full suite on every push to a branch.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-22.04"]') || fromJSON('["ubuntu-22.04", "macos-15"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: roc-pdf

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
          use-cache: false

      - name: Read pinned Roc nightly
        run: printf 'ROC_NIGHTLY_TAG=%s\n' "$(sed -n '1p' .roc-version)" >> "$GITHUB_ENV"

      - name: Install Roc
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ env.ROC_NIGHTLY_TAG }}

      # Pull-request CI is intentionally a fast public-surface smoke test.
      # The complete fixture, snapshot, allocation, renderer, and validator
      # suite remains available locally through ./scripts/test.py.
      - name: Check core package and public examples
        run: |
          roc check package/main.roc
          roc test package/main.roc
          for example in examples/*.roc; do
            roc test "$example"
          done

      - name: Run fuzz smoke tests
        run: roc test package/fuzz_evidence.roc
