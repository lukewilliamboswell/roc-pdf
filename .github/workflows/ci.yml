name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      nightly_validation:
        description: Validate without publication or deployment
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      source_sha: ${{ github.sha }}
      full_validation: ${{ github.event_name != 'pull_request' }}
      nightly_validation: ${{ inputs.nightly_validation || false }}
