name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      nightly_validation:
        description: "Validate a nightly candidate without publishing or deploying"
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The pull-request gate runs the Linux target, which is the one with
    # measured allocation baselines. macOS still runs on pushes to main and
    # on demand, so platform-specific breakage is caught without paying for
    # a second full suite on every push to a branch.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-22.04"]') || fromJSON('["ubuntu-22.04", "macos-15"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Blueprint verifies its own binary against the reviewed digest, then
      # fetches Zig 0.16.0 by the digest in Blueprint.lock for the dev tasks.
      - name: Install Blueprint
        uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@7aff4132691ad4fc348abe9df146a57512b49bd6
        with:
          cache: "true"
          cache-workload: dev

      - name: Check Blueprint configuration
        run: blueprint check

      - name: Read pinned Roc nightly
        run: printf 'ROC_NIGHTLY_TAG=%s\n' "$(sed -n '1p' .roc-version)" >> "$GITHUB_ENV"

      - name: Install Roc
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ env.ROC_NIGHTLY_TAG }}

      - name: Run spec-defined e2e evidence
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            blueprint run test -- --allocation-baselines
          else
            blueprint run test
          fi

      - name: Verify release bundle consumer boundary
        run: blueprint run bundle-consumer

      - name: Verify public example gallery
        if: runner.os == 'Linux'
        run: blueprint run gallery

  # Each property target builds and replays its seed corpus plus a few
  # fixed-seed inputs within one second of workload. The test job only
  # formats, checks, and runs the `expect`s in these sources. This job is
  # compile-bound (LLVM fuzz builds), so it runs beside the test job and
  # builds targets in parallel as memory allows. The bounded search is
  # fuzz.yml, which never runs on a pull request.
  fuzz-smoke:
    name: Fuzz smoke
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Blueprint
        uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@7aff4132691ad4fc348abe9df146a57512b49bd6
        with:
          cache: "true"
          cache-workload: dev

      - name: Read pinned Roc nightly
        run: printf 'ROC_NIGHTLY_TAG=%s\n' "$(sed -n '1p' .roc-version)" >> "$GITHUB_ENV"

      - name: Install Roc
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ env.ROC_NIGHTLY_TAG }}

      - name: Run property fuzz smoke
        run: blueprint run fuzz

  # Arlington PDF 2.0 object-model lane over every committed package snapshot
  # and public example. It runs after the Linux suite has proven the
  # snapshots are exactly what the package generates. The validator is the
  # digest-pinned veraPDF Arlington 1.30.2 service; service containers need a
  # Linux runner.
  arlington:
    name: Arlington PDF 2.0 object model
    needs: test
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: roc-pdf
    services:
      arlington:
        image: verapdf/arlington@sha256:1543368902c393771557e2a1da69e64ad72b69db32e6efebd38a09a7b86eacbc
        ports:
          - 18080:8080
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: roc-pdf

      - name: Check Arlington report contract
        run: python3 scripts/check_arlington.py --self-test

      - name: Validate snapshots and examples with Arlington
        run: python3 scripts/check_arlington.py --cases
