name: Build public documentation

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      docs_version:
        default: unreleased
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: 21.0.13+9
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: 3.14.0
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@e12512e2605608588782edb044dd766137e34869
      - name: Read pinned compiler
        run: printf 'ROC_NIGHTLY_TAG=%s\n' "$(cat .roc-version)" >> "$GITHUB_ENV"
      - uses: roc-lang/setup-roc@30af91a173612e462a5df47f3b697c53c211f48c
        with:
          download-method: asset-api
          version: nightly
          nightly-tag: ${{ env.ROC_NIGHTLY_TAG }}
      - name: Stage authored AsciiDoc and release metadata
        env:
          DOCS_REVISION: ${{ inputs.source_sha }}
          DOCS_VERSION: ${{ inputs.docs_version }}
        run: |
          binding_args=()
          if [[ "$DOCS_VERSION" != unreleased ]]; then
            ROC=roc bash scripts/bundle.sh --output-dir .roc-pdf-tmp/docs-bundle
            bundle=$(find .roc-pdf-tmp/docs-bundle -maxdepth 1 -name '*.tar.zst' -type f -print -quit)
            binding_args=(--release-version "$DOCS_VERSION" --bundle "$bundle")
          fi
          python3 scripts/prepare_manual.py --revision "$DOCS_REVISION" "${binding_args[@]}"
      - id: renderer
        uses: lukewilliamboswell/roc-automation/actions/blueprint-tool@e12512e2605608588782edb044dd766137e34869
        with:
          task: docs-path
          label: Locked documentation renderer
      - uses: lukewilliamboswell/roc-automation/actions/build-docs@e12512e2605608588782edb044dd766137e34869
        with:
          renderer-binary: ${{ steps.renderer.outputs.binary }}
          docs-directory: .roc-pdf-tmp/manual-source
          entrypoint: index.adoc
          output-directory: .roc-pdf-tmp/manual-build
          pdf-filename: roc-pdf.pdf
          docs-version: ${{ inputs.docs_version }}
          site-url: https://lukewilliamboswell.github.io/roc-pdf/manual/
      - name: Generate separate API, audit private types and verify manual
        env:
          DOCS_VERSION: ${{ inputs.docs_version }}
        run: blueprint run docs -- --manual-built
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: roc-pdf-docs-${{ inputs.source_sha }}
          path: generated-docs/
          if-no-files-found: error
          retention-days: 30
