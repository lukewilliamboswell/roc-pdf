name: Release candidate

on:
  pull_request:
  workflow_dispatch:
    inputs:
      nightly_validation:
        description: "Validate a nightly candidate without publishing or deploying"
        type: boolean
        required: false
        default: false
      release_tag:
        description: "The only supported release candidate tag: 0.1.0-rc2"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bundle-and-validate:
    name: Bundle and smoke-test gallery
    runs-on: ubuntu-latest
    steps:
      - name: Require a version for publication
        if: github.event_name == 'workflow_dispatch' && !inputs.nightly_validation
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_tag }}
        run: test -n "$RELEASE_VERSION" || { echo "A release version is required for publication" >&2; exit 1; }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This intentionally uses only released setup-roc inputs. It does not
      # download, build, or provision the local roc-lang/roc#10700 patch.
      - name: Read pinned Roc nightly
        run: printf 'ROC_NIGHTLY_TAG=%s\n' "$(sed -n '1p' .roc-version)" >> "$GITHUB_ENV"

      - name: Install Roc
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ env.ROC_NIGHTLY_TAG }}

      - name: Bundle package
        run: ROC=roc ./scripts/bundle.sh --output-dir dist

      - name: Smoke-test gallery against bundled package
        run: ROC=roc python3 scripts/check_gallery.py --bundle-path "$(find dist -maxdepth 1 -name '*.tar.zst' -type f -print -quit)"

      - name: Upload bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: roc-pdf-0.1.0-rc2-release
          path: dist/*.tar.zst
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish release candidate
    needs: bundle-and-validate
    if: (github.event_name == 'workflow_dispatch' && !inputs.nightly_validation)
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check release tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: test "$RELEASE_TAG" = "0.1.0-rc2"

      - name: Download validated bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: roc-pdf-0.1.0-rc2-release
          path: dist

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.tar.zst \
            --title "$RELEASE_TAG" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --notes-file docs/releases/0.1.0-rc2.md
