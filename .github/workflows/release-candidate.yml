name: Release candidate

on:
  pull_request:
  workflow_dispatch:
    inputs:
      nightly_validation:
        description: "Validate a nightly candidate without publishing or deploying"
        type: boolean
        required: false
        default: false
      release_tag:
        description: "Release tag to publish, such as 0.1.0 or 0.1.0-rc7; docs/releases/<tag>.md is the release body"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bundle-and-validate:
    name: Bundle and smoke-test gallery
    runs-on: ubuntu-latest
    steps:
      - name: Require a version for publication
        if: github.event_name == 'workflow_dispatch' && !inputs.nightly_validation
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_tag }}
        run: |
          test -n "$RELEASE_VERSION" || { echo "A release version is required for publication" >&2; exit 1; }
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]] || { echo "Release version must look like 0.1.0 or 0.1.0-rc7" >&2; exit 1; }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check release notes
        if: github.event_name == 'workflow_dispatch' && !inputs.nightly_validation
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_tag }}
        run: |
          notes="docs/releases/$RELEASE_VERSION.md"
          test -f "$notes" || { echo "Missing $notes" >&2; exit 1; }
          if grep -n 'TODO(release)' "$notes" README.md; then
            echo "Fill every TODO(release) placeholder before publishing" >&2
            exit 1
          fi
          grep -qF "$(sed -n '1p' .roc-version)" "$notes" || { echo "$notes must name the pinned Roc nightly" >&2; exit 1; }

      # This intentionally uses only released setup-roc inputs. It does not
      # download, build, or provision the local roc-lang/roc#10700 patch.
      - name: Read pinned Roc nightly
        run: printf 'ROC_NIGHTLY_TAG=%s\n' "$(sed -n '1p' .roc-version)" >> "$GITHUB_ENV"

      - name: Install Roc
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ env.ROC_NIGHTLY_TAG }}

      - name: Bundle package
        run: ROC=roc ./scripts/bundle.sh --output-dir dist

      - name: Smoke-test gallery against bundled package
        run: ROC=roc python3 scripts/check_gallery.py --bundle-path "$(find dist -maxdepth 1 -name '*.tar.zst' -type f -print -quit)"

      - name: Upload bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roc-pdf-release-bundle
          path: dist/*.tar.zst
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish release
    needs: bundle-and-validate
    if: (github.event_name == 'workflow_dispatch' && !inputs.nightly_validation)
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download validated bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: roc-pdf-release-bundle
          path: dist

      # The notes must already name the bundle this run validated, so the
      # published body, README and asset agree.
      - name: Check notes against bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          bundle="$(find dist -maxdepth 1 -name '*.tar.zst' -type f -print -quit)"
          notes="docs/releases/$RELEASE_TAG.md"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$(basename "$bundle")"
          digest="$(sha256sum "$bundle" | cut -d' ' -f1)"
          grep -qF "$url" "$notes" || { echo "$notes must name $url" >&2; exit 1; }
          grep -qF "$digest" "$notes" || { echo "$notes must state SHA-256 $digest" >&2; exit 1; }
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists" >&2
            exit 1
          fi
          printf 'BUNDLE=%s\n' "$bundle" >> "$GITHUB_ENV"

      # Relative links in the notes resolve against this commit's tree.
      - name: Pin release note links
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          python3 - "docs/releases/$RELEASE_TAG.md" "https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA" > "$RUNNER_TEMP/notes.md" <<'EOF'
          import posixpath, re, sys
          path, base = sys.argv[1], sys.argv[2]
          folder = posixpath.dirname(path)
          def pin(match):
              target = match.group(2)
              if re.match(r"[a-z]+:|#", target):
                  return match.group(0)
              return f"{match.group(1)}{base}/{posixpath.normpath(posixpath.join(folder, target))})"
          sys.stdout.write(re.sub(r"(\]\()([^)\s]+)\)", pin, open(path).read()))
          EOF

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          if [[ "$RELEASE_TAG" == *-rc* ]]; then kind=--prerelease; else kind=--latest; fi
          gh release create "$RELEASE_TAG" "$BUNDLE" \
            --title "roc-pdf $RELEASE_TAG" \
            "$kind" \
            --target "$GITHUB_SHA" \
            --notes-file "$RUNNER_TEMP/notes.md"
