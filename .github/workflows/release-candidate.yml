name: Release candidate

on:
  workflow_dispatch:
    inputs:
      nightly_validation:
        description: Validate a candidate without publishing or deploying
        default: false
        type: boolean
      release_tag:
        description: Authored release version, for example 0.3.0-rc1
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    outputs:
      source_sha: ${{ steps.identity.outputs.sha }}
      version: ${{ steps.identity.outputs.version }}
      prerelease: ${{ steps.identity.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: identity
        name: Record the default-branch commit and reject existing versions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          NIGHTLY_VALIDATION: ${{ inputs.nightly_validation }}
        run: |
          if [[ "$NIGHTLY_VALIDATION" != true ]]; then test "$SOURCE_REF" = refs/heads/main; fi
          if [[ -z "$RELEASE_VERSION" && "$NIGHTLY_VALIDATION" == true ]]; then
            RELEASE_VERSION=$(python3 scripts/release_artifacts.py --latest-notes)
          fi
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -f "docs/releases/$RELEASE_VERSION.md"
          printf 'sha=%s\nversion=%s\n' "$SOURCE_SHA" "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_VERSION" == *-rc* ]]; then prerelease=true; else prerelease=false; fi
          printf 'prerelease=%s\n' "$prerelease" >> "$GITHUB_OUTPUT"
          # Compiler-candidate dispatch retains its read-only branch/no-tag mode.
          if [[ "$NIGHTLY_VALIDATION" == true ]]; then exit 0; fi
          gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_VERSION" > "$RUNNER_TEMP/tags.json"
          gh release list --limit 1000 --json tagName > "$RUNNER_TEMP/releases.json"
          python3 - "$RUNNER_TEMP/tags.json" "$RUNNER_TEMP/releases.json" "$RELEASE_VERSION" <<'PYTHON'
          import json, sys
          tags, releases, version = sys.argv[1:]
          assert not any(tag['ref'] == 'refs/tags/' + version for tag in json.load(open(tags))), 'version tag already exists'
          assert not any(item['tagName'] == version for item in json.load(open(releases))), 'version release already exists'
          PYTHON

  checks:
    needs: validate
    uses: ./.github/workflows/checks.yml
    with:
      source_sha: ${{ needs.validate.outputs.source_sha }}
      release_version: ${{ needs.validate.outputs.version }}
      full_validation: true
      nightly_validation: ${{ inputs.nightly_validation }}

  publish:
    name: Publish tested release artifacts
    needs: [validate, checks]
    if: ${{ !inputs.nightly_validation }}
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: write
    steps:
      # No project checkout, source execution or rebuild occurs in this job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.checks.outputs.artifact-name }}
          path: dist
      - id: verified
        name: Verify the tested manifest, notes, revision and explicit asset inventory
        env:
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os
          from pathlib import Path
          root = Path('dist')
          manifest = json.loads((root / 'release-manifest.json').read_text())
          assert manifest['schema_version'] == 1
          assert manifest['revision'] == os.environ['SOURCE_SHA']
          assert manifest['version'] == os.environ['RELEASE_VERSION']
          assert hashlib.sha256((root / 'release-notes.md').read_bytes()).hexdigest() == manifest['notes_sha256']
          assets = manifest['assets']
          assert len(assets) == 4 and len({item['name'] for item in assets}) == 4
          assert sum(item['name'].endswith('.tar.zst') for item in assets) == 1
          version = os.environ['RELEASE_VERSION']
          assert {item['name'] for item in assets if not item['name'].endswith('.tar.zst')} == {
              f'roc-pdf-examples-{version}.zip', f'roc-pdf-docs-{version}.zip', f'roc-pdf-{version}.pdf'}
          for item in assets:
              assert Path(item['name']).name == item['name']
              path = root / item['name']
              assert path.is_file() and not path.is_symlink()
              assert path.stat().st_size == item['size']
              assert hashlib.sha256(path.read_bytes()).hexdigest() == item['sha256']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('assets<<ASSETS\n')
              output.write('\n'.join('dist/' + item['name'] for item in assets))
              output.write('\ndist/release-manifest.json\nASSETS\n')
          PYTHON
      - uses: lukewilliamboswell/roc-automation/actions/publish-release@8acff758d5d73210f1731bed75adb9322f5e773d
        with:
          version: ${{ needs.validate.outputs.version }}
          prerelease: ${{ needs.validate.outputs.prerelease }}
          target: ${{ needs.validate.outputs.source_sha }}
          notes-file: dist/release-notes.md
          assets: ${{ steps.verified.outputs.assets }}
